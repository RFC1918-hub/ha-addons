name: "Chord Uploader"
description: "Search Ultimate Guitar chord tabs, support manual chord uploads, and send to OnSong Cloud"
version: "0.1.3"
slug: "chord-uploader"
init: false
url: "https://github.com/pietern/chord-finder"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
ingress: true
ingress_port: 8080
ports:
  8080/tcp: 8080
panel_icon: "mdi:guitar-acoustic"
panel_title: "Chord Uploader"
map:
  - data:rw
options:
  onsong_token: ""
schema:
  onsong_token: str?
