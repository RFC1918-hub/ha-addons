version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_FROM: node:20-alpine
    ports:
      - "3001:8080"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - ONSONG_TOKEN=${ONSONG_TOKEN:-}
